# docker-compose.images.dev.yml  ─  dev.techderby.org (pre-built images)
# Ports: frontend=3001, strapi=1338
# Used by CI/CD on push to `dev` branch.
# Run: docker compose -f docker-compose.images.dev.yml --env-file .env.dev up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: techderby-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techderby_dev}
      POSTGRES_USER: ${POSTGRES_USER:-techderby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techderby} -d ${POSTGRES_DB:-techderby_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techderby-dev

  strapi:
    image: ${DOCKER_IMAGE_CMS:-techderby/cms}:${IMAGE_TAG:-dev-latest}
    container_name: techderby-dev-strapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-techderby_dev}
      DATABASE_USERNAME: ${POSTGRES_USER:-techderby}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Tech Derby <hello@techderby.org>}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-https://dev.techderby.org}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-https://cms-dev.techderby.org}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://dev.techderby.org}
    ports:
      - "1338:1337"
    volumes:
      - strapi_dev_uploads:/app/public/uploads
    networks:
      - techderby-dev

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-techderby/frontend}:${IMAGE_TAG:-dev-latest}
    container_name: techderby-dev-frontend
    restart: unless-stopped
    depends_on:
      - strapi
    ports:
      - "3001:3000"
    networks:
      - techderby-dev

volumes:
  postgres_dev_data:
    name: techderby-platform_postgres_dev_data
  strapi_dev_uploads:
    name: techderby-platform_strapi_dev_uploads

networks:
  techderby-dev:
    name: techderby-dev
