name: CI

# Runs on every push and pull request to any branch.
# Lints and tests the frontend; confirms the CMS can build.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend:
    name: Frontend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techderby-platform/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: techderby-platform/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  cms-build:
    name: CMS — build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techderby-platform/cms

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: techderby-platform/cms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Strapi
        run: npm run build
